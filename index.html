<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="noise"></div>

  <main class="container">
    <header>
      <h1 class="title">TIC<span class="accent">·</span>TAC<span class="accent">·</span>TOE</h1>
      <p class="subtitle">Two Player Game</p>
    </header>

    <div class="scoreboard">
      <div class="score-card" id="score-x">
        <span class="score-symbol x-symbol">X</span>
        <span class="score-label">Player X</span>
        <span class="score-value" id="score-x-val">0</span>
      </div>
      <div class="score-divider">
        <span class="score-draws-label">Draws</span>
        <span class="score-value" id="score-draws">0</span>
      </div>
      <div class="score-card" id="score-o">
        <span class="score-symbol o-symbol">O</span>
        <span class="score-label">Player O</span>
        <span class="score-value" id="score-o-val">0</span>
      </div>
    </div>

    <div class="status-bar">
      <div class="turn-indicator" id="turn-indicator">
        <span class="turn-dot" id="turn-dot"></span>
        <span id="status-text">Player X's Turn</span>
      </div>
    </div>

    <div class="board-wrapper">
      <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
    </div>

    <div class="result-overlay" id="result-overlay">
      <div class="result-card" id="result-card">
        <p class="result-emoji" id="result-emoji">🎉</p>
        <p class="result-text" id="result-text">Player X Wins!</p>
        <button class="btn-restart" id="btn-overlay-restart">Play Again</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn-restart" id="btn-restart">↺ Restart</button>
      <button class="btn-reset-score" id="btn-reset-score">Reset Score</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
